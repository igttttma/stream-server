<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Blimp</title>
<style>
  /* iOS system colors and type scale; text is kept large for small displays */
  :root {
    --bg: #f2f2f7; --surface: #ffffff; --text: #000000; --muted: rgba(60,60,67,.6); --separator: rgba(60,60,67,.18);
    --green: #34c759; --red: #ff3b30; --blue: #007aff; --gray: #8e8e93; --video-bg: #000;
    --avatar: linear-gradient(#a5abb8, #858994);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --surface: #1c1c1e; --text: #ffffff; --muted: rgba(235,235,245,.6); --separator: rgba(84,84,88,.6);
      --green: #30d158; --red: #ff453a; --blue: #0a84ff; --gray: #636366;
      --avatar: linear-gradient(#6e7280, #4b4e57);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --text: #ffffff; --muted: rgba(235,235,245,.6); --separator: rgba(84,84,88,.6);
    --green: #30d158; --red: #ff453a; --blue: #0a84ff; --gray: #636366;
    --avatar: linear-gradient(#6e7280, #4b4e57);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 19px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
  }
  header h1 { font-size: 30px; margin: 0; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
    background: var(--surface); font-size: 17px; font-weight: 500; color: var(--muted); white-space: nowrap;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gray); }
  .pill[data-s="online"] .dot { background: var(--green); }
  .pill[data-s="in_call"] .dot { background: var(--blue); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 20px 32px; min-height: 0; }
  .panel {
    width: 100%; max-width: 440px; text-align: center; background: var(--surface); border-radius: 22px;
    padding: 36px 24px 32px;
  }
  .avatar {
    width: 112px; height: 112px; margin: 0 auto 18px; border-radius: 50%; background: var(--avatar);
    display: grid; place-items: center;
  }
  .avatar svg { width: 62%; height: 62%; fill: #fff; }
  .panel h2 { font-size: 34px; margin: 0; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
  .panel p { margin: 6px 0 30px; font-size: 20px; color: var(--muted); }
  .panel.no-actions p { margin-bottom: 0; }
  .actions { display: flex; gap: 56px; justify-content: center; }

  /* Round buttons with a label underneath, as in the iOS Phone app */
  .action { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 17px; font-weight: 500; }
  .round {
    width: 76px; height: 76px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center;
    cursor: pointer; color: #fff; background: var(--gray); -webkit-tap-highlight-color: transparent;
  }
  .round svg { width: 34px; height: 34px; fill: currentColor; }
  .round:active { filter: brightness(.85); }
  .round.green { background: var(--green); }
  .round.red { background: var(--red); }
  .round.red .hang { transform: rotate(135deg); }
  .round:disabled { background: var(--gray); opacity: .5; cursor: not-allowed; }

  #callView { display: none; position: fixed; inset: 0; z-index: 10; background: var(--video-bg); color: #fff; }
  body.in-call main { display: none; }
  body.in-call #callView { display: block; }
  #remoteVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #localVideo {
    position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top)); width: 24%; max-width: 220px;
    aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: #2c2c2e; transform: scaleX(-1);
  }
  .glass { background: rgba(44,44,46,.6); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  #callInfo {
    position: absolute; left: 16px; top: calc(16px + env(safe-area-inset-top)); padding: 8px 16px; border-radius: 999px;
    font-size: 18px; font-weight: 600;
  }
  #callInfo:empty { display: none; }
  .controls {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 32px; justify-content: center;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .controls .action { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .controls .round { width: 68px; height: 68px; background: rgba(44,44,46,.6); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .controls .round svg { width: 30px; height: 30px; }
  .controls .round.off { background: #fff; color: #000; }
  .controls .round.red { background: var(--red); }
  /* Blimp's display is 16:9 landscape: phones are asked to turn sideways */
  #rotateHint {
    display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center;
    padding: 24px; background: rgba(0,0,0,.7); color: #fff; font-size: 22px; font-weight: 600; pointer-events: none;
  }
  @media (orientation: portrait) and (pointer: coarse) {
    body.in-call #rotateHint { display: flex; }
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(120px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 12px 20px; border-radius: 999px; font-size: 18px; font-weight: 500; color: var(--bg);
    background: var(--text); opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: calc(100% - 32px); z-index: 20; text-align: center;
  }
  #toast.show { opacity: .92; }
  body.in-call #toast { color: #000; background: #fff; }
</style>
</head>
<body>
<header>
  <h1 id="title">Call Blimp</h1>
  <span class="pill" id="presence" data-s="offline"><span class="dot"></span><span id="presenceText">Connecting…</span></span>
</header>

<main>
  <section class="panel" id="panel"></section>
</main>

<section id="callView">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div id="callInfo" class="glass"></div>
  <div id="rotateHint">Turn your phone sideways.<br>Blimp's screen is landscape.</div>
  <div class="controls">
    <div class="action"><button id="micBtn" class="round" aria-label="Mute"></button><span id="micLabel">Mute</span></div>
    <div class="action"><button id="camBtn" class="round" aria-label="Camera"></button><span id="camLabel">Camera</span></div>
    <div class="action"><button id="hangupBtn" class="round red" aria-label="End"></button><span>End</span></div>
  </div>
</section>

<div id="toast" role="status"></div>

<script type="module">
import { CallClient } from "./call-client.mjs";

// ?as=blimp&token=… turns this page into a Blimp test console (the real Blimp
// is the BlimpMate client). Everyone else is the remote user.
const params = new URLSearchParams(location.search);
const asBlimp = params.get("as") === "blimp";
const me = asBlimp ? "blimp" : "remote";
const peerName = asBlimp ? "Remote user" : "Blimp";
const wsUrl = new URL("ws", location.href.replace(/^http/, "ws"));
wsUrl.search = asBlimp ? `?role=blimp&token=${encodeURIComponent(params.get("token") || "")}` : "?role=remote";

const $ = (id) => document.getElementById(id);

// ---- landscape video ----
// Blimp shows the remote video on a fixed 16:9 landscape screen. Video that
// isn't already 16:9 landscape (phones, 4:3 webcams) is center-cropped to
// 960x540 through a canvas, so Blimp always gets landscape frames.
const OUT_W = 960, OUT_H = 540, OUT_FPS = 24;
const isPhone = matchMedia("(pointer: coarse)").matches;

async function landscapeMedia() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 }, aspectRatio: { ideal: 16 / 9 }, frameRate: { ideal: OUT_FPS } },
  });
  const [cam] = stream.getVideoTracks();
  const { width, height } = cam?.getSettings() || {};
  // Phones can rotate mid-call, so they always go through the crop
  if (!cam || (!isPhone && width && height && Math.abs(width / height - 16 / 9) < 0.02)) return stream;

  const video = document.createElement("video");
  video.muted = true;
  video.playsInline = true;
  video.srcObject = new MediaStream([cam]);
  await video.play().catch(() => {});
  const canvas = Object.assign(document.createElement("canvas"), { width: OUT_W, height: OUT_H });
  const g = canvas.getContext("2d");
  const timer = setInterval(() => {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    const scale = Math.max(OUT_W / vw, OUT_H / vh);
    const sw = OUT_W / scale, sh = OUT_H / scale;
    g.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, OUT_W, OUT_H);
  }, 1000 / OUT_FPS);
  const out = canvas.captureStream(OUT_FPS).getVideoTracks()[0];
  // Stopping the sent track (hang up) also releases the camera
  const stopOut = out.stop.bind(out);
  out.stop = () => {
    clearInterval(timer);
    cam.stop();
    video.srcObject = null;
    stopOut();
  };
  return new MediaStream([...stream.getAudioTracks(), out]);
}

// Phones: full screen, locked to landscape where the browser allows it (Android
// Chrome). Elsewhere (iOS) the rotate hint asks the user to turn the phone.
function enterLandscape() {
  if (!isPhone || document.fullscreenElement) return;
  const el = document.documentElement;
  const req = el.requestFullscreen?.({ navigationUI: "hide" });
  Promise.resolve(req).then(() => screen.orientation?.lock?.("landscape")).catch(() => {});
}
function leaveLandscape() {
  try { screen.orientation?.unlock?.(); } catch {}
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

const client = new CallClient({ url: wsUrl.toString(), getMedia: landscapeMedia });
window.callClient = client; // for debugging and automated tests

if (asBlimp) {
  document.title = "Blimp test console";
  $("title").textContent = "Blimp test console";
}

// ---- tones (generated, no audio files) ----
let audioCtx = null;
let toneTimer = null;
function ctx() {
  audioCtx ||= new AudioContext();
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  return audioCtx;
}
function beep(freqs, seconds) {
  const c = ctx();
  const gain = c.createGain();
  gain.gain.value = 0.08;
  gain.connect(c.destination);
  for (const f of freqs) {
    const osc = c.createOscillator();
    osc.frequency.value = f;
    osc.connect(gain);
    osc.start();
    osc.stop(c.currentTime + seconds);
  }
}
function startTone(kind) {
  stopTone();
  // Incoming: two short bursts every 3s. Outgoing ringback: 2s on, 4s off.
  const play = kind === "incoming"
    ? () => { beep([480, 620], 0.4); setTimeout(() => beep([480, 620], 0.4), 600); }
    : () => beep([440, 480], 2);
  play();
  toneTimer = setInterval(play, kind === "incoming" ? 3000 : 6000);
}
function stopTone() {
  clearInterval(toneTimer);
  toneTimer = null;
}
document.addEventListener("pointerdown", () => ctx(), { once: true });

// ---- rendering ----
const svg = (body, cls = "") => `<svg viewBox="0 0 24 24" aria-hidden="true" class="${cls}">${body}</svg>`;
const SLASH = `<path d="M3.5 2.1 21.9 20.5l-1.4 1.4L2.1 3.5z"/>`;
const ICON = {
  person: svg(`<path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.3-8 5.2V21h16v-1.8c0-2.9-3.6-5.2-8-5.2Z"/>`),
  video: svg(`<path d="M4 6h10a2 2 0 0 1 2 2v1.6l3.9-2.5A.75.75 0 0 1 21 7.7v8.6a.75.75 0 0 1-1.1.6L16 14.4V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/>`),
  hang: svg(`<path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8Z"/>`, "hang"),
  mic: `<path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.6a6 6 0 0 0 5-5.9Z"/>`,
};
ICON.camera = ICON.video.replace(/<\/?svg[^>]*>/g, "");
const action = (id, cls, icon, label, disabled = false) =>
  `<div class="action"><button id="${id}" class="round ${cls}" aria-label="${label}" ${disabled ? "disabled" : ""}>${icon}</button><span>${label}</span></div>`;
const card = (title, sub, actions = "") =>
  `<div class="avatar">${ICON.person}</div><h2>${title}</h2><p>${sub}</p>${actions && `<div class="actions">${actions}</div>`}`;
$("hangupBtn").innerHTML = ICON.hang;

let waiting = false;
const REASONS = {
  declined: `${peerName} declined the call`,
  cancelled: `${peerName} cancelled the call`,
  no_answer: "No answer",
  hangup: "Call ended",
  peer_left: `${peerName} went offline`,
  connection_lost: "Connection lost",
};

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 3500);
}

function render() {
  const peerStatus = client.connected ? client.presence[asBlimp ? "remote" : "blimp"] : "offline";
  const pill = $("presence");
  pill.dataset.s = peerStatus;
  $("presenceText").textContent = !client.connected ? "Connecting…"
    : waiting ? "Someone else is using this page"
    : `${peerName} ${peerStatus === "in_call" ? "in a call" : peerStatus}`;

  const { state, direction } = client.call;
  document.body.classList.toggle("in-call", state === "in_call");
  const panel = $("panel");
  panel.className = "panel";

  if (waiting) {
    panel.classList.add("no-actions");
    panel.innerHTML = card("Line busy", "Another person is already connected. You'll be connected when they leave.");
  } else if (state === "ringing" && direction === "incoming") {
    panel.innerHTML = card(peerName, "Incoming video call",
      action("declineBtn", "red", ICON.hang, "Decline") + action("acceptBtn", "green", ICON.video, "Accept"));
    $("acceptBtn").onclick = async () => {
      enterLandscape();
      // Get the camera/mic permission prompt out of the way before answering
      try { await client.ensureMedia(); } catch (e) { return toast(`Camera/mic unavailable: ${e.message}`); }
      client.accept();
    };
    $("declineBtn").onclick = () => client.decline();
  } else if (state === "ringing") {
    panel.innerHTML = card(peerName, "Calling…", action("cancelBtn", "red", ICON.hang, "Cancel"));
    $("cancelBtn").onclick = () => client.hangup();
  } else {
    const online = peerStatus === "online";
    panel.innerHTML = card(peerName,
      online ? "Available for a video call" : peerStatus === "in_call" ? "In another call" : `Offline. You can call when ${peerName} comes online.`,
      action("callBtn", "green", ICON.video, "Video call", !online));
    $("callBtn").onclick = async () => {
      ctx();
      enterLandscape();
      try { await client.ensureMedia(); } catch (e) { return toast(`Camera/mic unavailable: ${e.message}`); }
      if (!client.invite()) toast("Not connected");
    };
  }

  if (state === "ringing") startTone(direction);
  else stopTone();
}

client.addEventListener("status", render);
client.addEventListener("presence", render);
client.addEventListener("waiting", () => { waiting = true; render(); });
client.addEventListener("welcome", () => { waiting = false; render(); });
client.addEventListener("call", (e) => {
  waiting = false;
  if (e.detail.state === "idle") leaveLandscape();
  if (e.detail.state === "idle" && e.detail.reason) toast(REASONS[e.detail.reason] || `Call ended (${e.detail.reason})`);
  if (e.detail.state === "in_call") {
    micOn = camOn = true;
    syncControls();
    $("callInfo").textContent = `In a call with ${peerName}`;
  }
  render();
});
client.addEventListener("error", (e) => {
  const err = e.detail.error;
  client.releaseMedia();
  if (client.call.state === "idle") leaveLandscape();
  toast(err === "peer_offline" ? `${peerName} is offline` : err === "busy" ? "Line busy"
    : err === "replaced" ? "Signed in somewhere else" : `Error: ${err}`);
});
client.addEventListener("connection", (e) => {
  const s = e.detail.state;
  $("callInfo").textContent = s === "connected" ? `In a call with ${peerName}`
    : s === "disconnected" ? "Reconnecting…" : s === "connecting" || s === "new" ? "Connecting…" : $("callInfo").textContent;
});
client.addEventListener("local-stream", (e) => { $("localVideo").srcObject = e.detail; });
client.addEventListener("remote-stream", (e) => {
  const v = $("remoteVideo");
  if (v.srcObject !== e.detail) v.srcObject = e.detail;
  if (e.detail) v.play().catch(() => {});
});

let micOn = true, camOn = true;
// A white button means the mic or camera is off, as in FaceTime
function syncControls() {
  $("micBtn").innerHTML = svg(ICON.mic + (micOn ? "" : SLASH));
  $("micBtn").classList.toggle("off", !micOn);
  $("micLabel").textContent = micOn ? "Mute" : "Unmute";
  $("camBtn").innerHTML = svg(ICON.camera + (camOn ? "" : SLASH));
  $("camBtn").classList.toggle("off", !camOn);
  $("camLabel").textContent = camOn ? "Camera" : "Camera off";
}
syncControls();
$("micBtn").onclick = () => { micOn = !micOn; client.setMicEnabled(micOn); syncControls(); };
$("camBtn").onclick = () => { camOn = !camOn; client.setCameraEnabled(camOn); syncControls(); };
$("hangupBtn").onclick = () => client.hangup();

client.connect();
render();
</script>
</body>
</html>
